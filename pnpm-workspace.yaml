# pnpm 10+ blocks dependency build scripts by default. Allow the ones we rely on:
# esbuild (native binary), puppeteer (Chromium download), tldjs (TLD-list refresh).
allowBuilds:
  esbuild: true
  puppeteer: true
  tldjs: true
